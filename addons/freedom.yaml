name: freedom
description: Headless text browser (curlfree engine, FreeDom omnibox), rebuilt from its C source inside the OS (http-only miniGCC build; https needs the host-built freedom).
author: miniOS
version: "1.0.0"
install:
  repo_url: https://github.com/grisuno/miniOS.git
  files:
    - src: progs/src/freedom.c
      dst: build/freedom.c
  build:
    - run objects/minigcc.o build/freedom.c > build/freedom.s
    - run objects/ld.o -f elf -o bin/freedom-mini build/freedom.s
  verify:
    - line: freedom-mini
      exit_code: 1
    - line: freedom-mini http://10.0.2.2:8899/README.txt
      exit_code: 0
