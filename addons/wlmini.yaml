name: wlmini
description: Wayland-mini subset (wire protocol plus session plus mailbox transport plus ring-3 wlcomp compositor, max 8 tiled windows with title bars, close, resize, minimize and static-pool compositing over GFX_PRESENT). Header-only contracts progs/wl/wl_mini.h, progs/wl/wl_mbox.h and progs/wl/wl_client.h plus shared palette progs/nk_palette.h plus bin/wlcomp with server, once, client and clean modes; host-tested by make test-wl. Ships on MiniFS as wlcomp plus the bare-name alias.
author: miniOS
version: "0.4.0"
install:
  repo_url: https://github.com/grisuno/miniOS.git
  kind: host
  dir_var: WLMINI_DIR
  artifact: wlcomp
  files: []
  host_build:
    - make progs/bin/wlcomp.elf
  verify:
    - line: wlcomp --selftest
      exit_code: 0
