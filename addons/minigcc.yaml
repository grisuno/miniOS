name: minigcc
description: miniGCC C compiler (ET_REL toolchain object). Built on the host from the sibling checkout and packed as objects/minigcc.o on the ramdisk; in-OS compiles run through it (run objects/minigcc.o src/p.c > asm/p.s).
author: miniOS
version: "1.0.0"
install:
  repo_url: https://github.com/grisuno/miniGCC
  kind: host
  dir_var: MINIGCC_DIR
  artifact: objects/minigcc.o
  files: []
  host_build:
    - make progs/objects/minigcc.o
  verify:
    - line: run objects/minigcc.o src/cp.c > build/mgcc.s
      exit_code: 0
